<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maktab AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#16140f; --card:#211e16; --line:#383324;
  --gold:#d4a937; --gold-soft:#f0d98a; --text:#f3eee0; --muted:#9a927c;
  --nav-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:20px 16px calc(var(--nav-h) + 28px)}
.page{display:none}
.page.active{display:block}
header{margin-bottom:18px}
header h1{font-size:26px;color:var(--gold-soft)}
header p{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:18px;margin-bottom:6px}
.card p{color:var(--muted);font-size:14px}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.subject{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 12px;color:var(--text);font-size:16px;font-weight:600;cursor:pointer;text-align:center}
.subject.on{border-color:var(--gold);background:#2b2516;color:var(--gold-soft)}
.subject span{display:block;font-size:28px;margin-bottom:4px}
textarea,input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;resize:none}
textarea:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{width:100%;background:var(--gold);color:#1b1608;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:transparent;color:var(--gold-soft);border:1px solid var(--gold)}
.answer{margin-top:12px;white-space:pre-wrap;font-size:15px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;font-size:15px;cursor:pointer}
.opt.right{border-color:#5fae6e;background:#1a2a1d}
.opt.wrong{border-color:#c75a4a;background:#2e1a17}
.note{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.note button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--card);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:34px;font-family:Georgia,serif;color:var(--gold-soft);margin:6px auto 12px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.center{text-align:center}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}
.row b{color:var(--gold-soft)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;color:var(--muted);height:var(--nav-h);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .ic{font-size:22px}
nav button.active{color:var(--gold)}
nav button:focus-visible,.subject:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="app">

  <!-- Bosh sahifa -->
  <section class="page active" id="home">
    <header>
      <h1>Salom, <span class="uname">o'quvchi</span>!</h1>
      <p>Qaysi fan bo'yicha yordam kerak?</p>
    </header>
    <div class="subjects">
      <button class="subject on" data-subject="math"><span>➗</span>Matematika</button>
      <button class="subject" data-subject="english"><span>🔤</span>Ingliz tili</button>
    </div>
    <div class="card">
      <textarea id="question" rows="4" placeholder="Savolingizni yozing..."></textarea>
      <button class="btn" id="askBtn">Savol berish</button>
      <div class="answer" id="answer"></div>
    </div>
  </section>

  <!-- Quiz -->
  <section class="page" id="quiz">
    <header>
      <h1>Quiz</h1>
      <p>Bilimingizni sinab ko'ring</p>
    </header>
    <div class="card" id="quizCard"></div>
  </section>

  <!-- Kundalik -->
  <section class="page" id="diary">
    <header>
      <h1>Kundalik</h1>
      <p>Eslatmalaringiz shu yerda saqlanadi</p>
    </header>
    <div class="card">
      <input id="noteInput" type="text" placeholder="Masalan: Juma kuni matematika testi">
      <button class="btn" id="addNote">Eslatma qo'shish</button>
    </div>
    <div id="notes"></div>
  </section>

  <!-- Profil -->
  <section class="page" id="profile">
    <header>
      <h1>Profil</h1>
    </header>
    <div class="card center">
      <div class="avatar" id="avatar">?</div>
      <h2 class="uname">O'quvchi</h2>
      <p id="username"></p>
    </div>
    <div class="card">
      <div class="row"><span>Eslatmalar</span><b id="statNotes">0</b></div>
      <div class="row"><span>Quiz natijasi</span><b id="statQuiz">0 / 0</b></div>
    </div>
  </section>
</div>

<nav>
  <div>
    <button class="active" data-page="home"><span class="ic">🏠</span>Bosh sahifa</button>
    <button data-page="quiz"><span class="ic">🧠</span>Quiz</button>
    <button data-page="diary"><span class="ic">📅</span>Kundalik</button>
    <button data-page="profile"><span class="ic">👤</span>Profil</button>
  </div>
</nav>

<script>
// ---------- Telegram SDK ----------
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#16140f'); tg.setBackgroundColor('#16140f'); } catch (e) {}
}
const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const firstName = user ? user.first_name : "o'quvchi";
document.querySelectorAll('.uname').forEach(el => el.textContent = user ? user.first_name : el.textContent);
document.getElementById('username').textContent = user && user.username ? '@' + user.username : 'Telegram orqali kirilgan';
const av = document.getElementById('avatar');
if (user && user.photo_url) av.innerHTML = '<img src="' + user.photo_url + '" alt="">';
else av.textContent = firstName.charAt(0).toUpperCase();

// ---------- Navigatsiya ----------
const pages = document.querySelectorAll('.page');
const navBtns = document.querySelectorAll('nav button');
navBtns.forEach(b => b.addEventListener('click', () => {
  pages.forEach(p => p.classList.toggle('active', p.id === b.dataset.page));
  navBtns.forEach(n => n.classList.toggle('active', n === b));
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  window.scrollTo(0, 0);
}));

// ---------- Bosh sahifa ----------
let subject = 'math';
document.querySelectorAll('.subject').forEach(b => b.addEventListener('click', () => {
  subject = b.dataset.subject;
  document.querySelectorAll('.subject').forEach(s => s.classList.toggle('on', s === b));
}));
document.getElementById('askBtn').addEventListener('click', () => {
  const q = document.getElementById('question').value.trim();
  const out = document.getElementById('answer');
  if (!q) { out.textContent = 'Avval savolingizni yozing.'; return; }
  // 3-bosqichda bu yerga AI (backend) ulanadi
  out.textContent = 'AI hali ulanmagan. 3-bosqichda shu yerda javob chiqadi.\n\nFan: ' + (subject === 'math' ? 'Matematika' : 'Ingliz tili');
});

// ---------- Quiz (namuna savollar) ----------
const questions = [
  { q: '12 × 8 nechaga teng?', o: ['86', '96', '104'], a: 1 },
  { q: '"Apple" so\'zining tarjimasi?', o: ['Nok', 'Olma', 'Anor'], a: 1 },
  { q: '"I ___ a student." Bo\'sh joyga qo\'ying.', o: ['is', 'are', 'am'], a: 2 }
];
let qi = 0, score = 0, answered = 0;
const quizCard = document.getElementById('quizCard');
function renderQuiz() {
  if (qi >= questions.length) {
    quizCard.innerHTML = '<h2>Tugadi!</h2><p>Natija: ' + score + ' / ' + questions.length + '</p><button class="btn" id="again">Qaytadan boshlash</button>';
    document.getElementById('again').onclick = () => { qi = 0; score = 0; renderQuiz(); };
    return;
  }
  const item = questions[qi];
  quizCard.innerHTML = '<p>Savol ' + (qi + 1) + ' / ' + questions.length + '</p><h2>' + item.q + '</h2>' +
    item.o.map((t, i) => '<button class="opt" data-i="' + i + '">' + t + '</button>').join('');
  quizCard.querySelectorAll('.opt').forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.i;
    quizCard.querySelectorAll('.opt').forEach(o => o.disabled = true);
    quizCard.querySelectorAll('.opt')[item.a].classList.add('right');
    answered++;
    if (i === item.a) score++; else btn.classList.add('wrong');
    document.getElementById('statQuiz').textContent = score + ' / ' + answered;
    setTimeout(() => { qi++; renderQuiz(); }, 900);
  });
}
renderQuiz();

// ---------- Kundalik ----------
// Hozircha xotirada saqlanadi. 3-bosqichda bazaga ulanadi.
let notes = [];
const notesBox = document.getElementById('notes');
function renderNotes() {
  document.getElementById('statNotes').textContent = notes.length;
  if (!notes.length) { notesBox.innerHTML = '<div class="card"><p>Hozircha eslatma yo\'q. Birinchisini yuqorida yozing.</p></div>'; return; }
  notesBox.innerHTML = notes.map((n, i) =>
    '<div class="card note"><span></span><button aria-label="O\'chirish" data-i="' + i + '">✕</button></div>').join('');
  notesBox.querySelectorAll('.note').forEach((el, i) => el.firstChild.textContent = notes[i]);
  notesBox.querySelectorAll('button').forEach(b => b.onclick = () => { notes.splice(+b.dataset.i, 1); renderNotes(); });
}
function addNote() {
  const inp = document.getElementById('noteInput');
  const v = inp.value.trim();
  if (!v) return;
  notes.unshift(v); inp.value = ''; renderNotes();
}
document.getElementById('addNote').onclick = addNote;
document.getElementById('noteInput').addEventListener('keydown', e => { if (e.key === 'Enter') addNote(); });
renderNotes();
</script>
</body>
</html>
